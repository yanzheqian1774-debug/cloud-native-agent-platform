apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.agentos.io

spec:
  group: agentos.io

  scope: Namespaced

  names:
    plural: tasks
    singular: task
    kind: Task
    shortNames:
      - task

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object
              required:
                - agentRef
                - input

              properties:
                agentRef:
                  type: object
                  required:
                    - name

                  properties:
                    name:
                      type: string
                      minLength: 1

                input:
                  type: object
                  required:
                    - prompt

                  properties:
                    prompt:
                      type: string
                      minLength: 1

                timeoutSeconds:
                  type: integer
                  minimum: 1
                  default: 300

            status:
              type: object

              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed

                result:
                  type: string

                message:
                  type: string

                startedAt:
                  type: string
                  format: date-time

                completedAt:
                  type: string
                  format: date-time

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agentRef.name

        - name: Phase
          type: string
          jsonPath: .status.phase

        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
