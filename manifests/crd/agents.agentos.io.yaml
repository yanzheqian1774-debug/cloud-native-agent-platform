apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agentos.io
spec:
  group: agentos.io

  scope: Namespaced

  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames:
      - ag

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object
              required:
                - runtime
                - model

              properties:
                runtime:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - native
                        - hermes
                        - external

                    image:
                      type: string

                model:
                  type: object
                  required:
                    - provider
                    - name
                  properties:
                    provider:
                      type: string

                    name:
                      type: string

                    endpoint:
                      type: string

                capabilities:
                  type: array
                  items:
                    type: string

                replicas:
                  type: integer
                  minimum: 0
                  default: 1

                resources:
                  type: object
                  properties:
                    cpu:
                      type: string

                    memory:
                      type: string

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Running
                    - Degraded
                    - Failed
                    - Terminating

                observedGeneration:
                  type: integer
                  format: int64

                readyReplicas:
                  type: integer
                  format: int32

                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Runtime
          type: string
          jsonPath: .spec.runtime.type

        - name: Model
          type: string
          jsonPath: .spec.model.name

        - name: Replicas
          type: integer
          jsonPath: .spec.replicas

        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas

        - name: Phase
          type: string
          jsonPath: .status.phase

        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
