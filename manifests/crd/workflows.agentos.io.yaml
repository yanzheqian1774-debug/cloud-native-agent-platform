apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.agentos.io
spec:
  group: agentos.io

  scope: Namespaced

  names:
    plural: workflows
    singular: workflow
    kind: Workflow
    shortNames:
      - wf

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object
              required:
                - tasks

              properties:
                tasks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - agentRef
                      - input

                    properties:
                      name:
                        type: string
                        minLength: 1

                      agentRef:
                        type: object
                        required:
                          - name

                        properties:
                          name:
                            type: string
                            minLength: 1

                      input:
                        type: object
                        required:
                          - prompt
                        properties:
                          prompt:
                            type: string
                            minLength: 1
                          from:
                            type: array
                            default: []
                            items:
                              type: object
                              required:
                                - task
                              properties:
                                task:
                                  type: string
                                  minLength: 1

                      dependsOn:
                        type: array
                        default: []
                        items:
                          type: string
                          minLength: 1

                      timeoutSeconds:
                        type: integer
                        minimum: 1
                        default: 300

            status:
              type: object

              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed

                startedAt:
                  type: string
                  format: date-time

                completedAt:
                  type: string
                  format: date-time

                taskCount:
                  type: integer
                  minimum: 0

                tasks:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Running
                          - Succeeded
                          - Failed
                          - TimedOut
                          - Skipped

                      taskRef:
                        type: object
                        properties:
                          name:
                            type: string

                      reason:
                        type: string

                      message:
                        type: string

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase

        - name: Tasks
          type: integer
          jsonPath: .status.taskCount

        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
