apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: agent-system
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: enterprise-agent-os

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: agent-operator

  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-operator
        app.kubernetes.io/part-of: enterprise-agent-os

    spec:
      serviceAccountName: agent-operator

      containers:
        - name: operator
          image: enterprise-agent-operator:v0.1-dev
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
