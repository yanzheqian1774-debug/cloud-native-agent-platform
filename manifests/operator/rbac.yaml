apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-operator

rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
      
  - apiGroups:
      - agentos.io
    resources:
      - agents
      - tasks
    verbs:
      - get
      - list
      - watch
      - patch

  - apiGroups:
      - agentos.io
    resources:
      - agents/status
      - tasks/status
    verbs:
      - get
      - patch
      - update

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-operator

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-operator

subjects:
  - kind: ServiceAccount
    name: agent-operator
    namespace: agent-system
