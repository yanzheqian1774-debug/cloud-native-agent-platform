apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-definition-postgres
  namespace: agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-definition-postgres
  template:
    metadata:
      labels:
        app: agent-definition-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: agent_platform
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-definition-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-definition-postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agent_console", "-d", "agent_platform"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-definition-postgres
  namespace: agent-system
spec:
  selector:
    app: agent-definition-postgres
  ports:
    - port: 5432
      targetPort: 5432
