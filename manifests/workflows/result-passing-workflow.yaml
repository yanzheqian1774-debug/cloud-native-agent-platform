apiVersion: agentos.io/v1alpha1
kind: Workflow
metadata:
  name: result-passing-e2e
  namespace: agent-workloads

spec:
  tasks:
    - name: research
      agentRef:
        name: researcher-agent
      input:
        prompt: |
          Reply with exactly one short sentence:
          Kubernetes-native Agent platforms use declarative control planes.
      timeoutSeconds: 300

    - name: market
      agentRef:
        name: researcher-agent
      dependsOn:
        - research
      input:
        prompt: |
          Based on the previous result, reply with one short sentence
          about the market implication.
        from:
          - task: research
      timeoutSeconds: 300

    - name: technology
      agentRef:
        name: researcher-agent
      dependsOn:
        - research
      input:
        prompt: |
          Based on the previous result, reply with one short sentence
          about the technical implication.
        from:
          - task: research
      timeoutSeconds: 300

    - name: report
      agentRef:
        name: researcher-agent
      dependsOn:
        - market
        - technology
      input:
        prompt: |
          Combine the two previous results into one short final sentence.
        from:
          - task: market
          - task: technology
      timeoutSeconds: 300
