name: S5 IMPL 319 Mock Provider Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/s5-v023-impl-319-mock-provider.yml"
      - "console/backend/**"
      - "console/frontend/**"
      - "scripts/acceptance/s5_v023_impl_319_owned_cleanup.sh"
      - "scripts/acceptance/s5_v023_impl_319_mock_provider.sh"
      - "docs/exec-plans/active/S5-V023-IMPL-319-PROBLEM-DRAFT-ASSISTANCE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s5-v023-impl-319-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-provider:
    name: PostgreSQL HTTPS Chromium Mock Provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: s5_v023_impl_319_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d s5_v023_impl_319_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: conformance_harness/src:core/src:gateway/src:operator/src:runtime/src:console/backend/src:console/backend/tests:experiments/s5-spike-005-runtime-target-manifest:experiments/s5-spike-007-capability-rest-fixtures
      ACCEPTANCE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/s5_v023_impl_319_acceptance

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: console/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and lint exact frontend
        working-directory: console/frontend
        env:
          VITE_SUPPLIER_QUALITY_DEMO_MODE: live
          VITE_PROBLEM_DRAFT_ASSISTANCE: enabled
        run: |
          npm run lint
          npm run build

      - name: Focused backend and contract tests
        env:
          DRAFT_PROVIDER_BUDGET_TEST_DATABASE_URL: ${{ env.ACCEPTANCE_DATABASE_URL }}
        run: |
          uv run ruff check \
            console/backend/src/agent_console/draft_assistance.py \
            console/backend/src/agent_console/draft_assistance_bootstrap.py \
            console/backend/src/agent_console/draft_provider_budget_postgres.py \
            console/backend/src/agent_console/openai_responses_draft_adapter.py \
            console/backend/tests/s5_v023_impl_319_draft_fixture.py \
            console/backend/tests/s5_v023_impl_319_mock_responses_server.py \
            console/backend/tests/test_draft_assistance.py \
            console/backend/tests/test_draft_provider_budget_postgres.py \
            console/backend/tests/test_openai_responses_draft_adapter.py
          uv run pytest -q \
            console/backend/tests/test_draft_assistance.py \
            console/backend/tests/test_draft_provider_budget_postgres.py \
            console/backend/tests/test_openai_responses_draft_adapter.py \
            console/frontend/tests/test_s5_v023_impl_299_business_workspace.py \
            console/frontend/tests/test_s5_v023_impl_319_mock_provider_workflow.py

      - name: Responses 323 isolation and planning usage closure
        env:
          PLANNING323_TEST_DATABASE_URL: ${{ env.ACCEPTANCE_DATABASE_URL }}
        run: |
          uv run pytest -q -o junit_family=legacy \
            --junitxml=${{ runner.temp }}/responses-323.xml \
            console/backend/tests/test_responses_deadline.py \
            console/backend/tests/test_planning_responses_boundaries.py \
            console/backend/tests/test_planning_usage_closure.py \
            console/backend/tests/test_understanding_usage_closure.py \
            console/backend/tests/test_provider_usage_authorization.py \
            console/backend/tests/test_provider_usage_grant_flow.py \
            console/backend/tests/test_kimi_planning_mainline.py \
            console/backend/tests/test_planning_grant_discovery.py \
            console/backend/tests/test_task_delegation.py

      - name: Understanding usage and cancellation UI (controlled 323)
        working-directory: console/frontend
        env:
          CONSOLE_FRONTEND_PORT: "19329"
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/understanding-usage-ui
        run: npx playwright test --config playwright.s5-323-usage.config.ts

      - name: Prove owned cleanup preserves an injected failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash -c '
            set -euo pipefail
            source scripts/acceptance/s5_v023_impl_319_owned_cleanup.sh
            mock_pid=""
            server_pid=""
            trap s5_319_exit_trap EXIT
            trap "s5_319_signal_trap 130" INT
            trap "s5_319_signal_trap 143" TERM
            exit 37
          '
          injected_status=$?
          set -e
          test "$injected_status" -eq 37

      - name: Discover dedicated browser journeys
        working-directory: console/frontend
        env:
          S5_319_WORKBENCH_URL: https://127.0.0.1:19443
          S5_319_APPLICANT_CREDENTIAL: discovery-only
          S5_319_ADMIN_CREDENTIAL: discovery-only
        run: >-
          npx playwright test --config playwright.s5-319.config.ts
          --list --workers=1 --retries=0 --forbid-only

      - name: Run native HTTPS mock-provider journeys
        shell: bash
        env:
          S5_319_EVIDENCE_DIR: ${{ runner.temp }}
        run: bash scripts/acceptance/s5_v023_impl_319_mock_provider.sh

      - name: Upload bounded 319 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-v023-impl-319-mock-provider-evidence
          path: |
            ${{ runner.temp }}/responses-323.xml
            ${{ runner.temp }}/s5-v023-impl-319-evidence.json
            ${{ runner.temp }}/s5-v023-impl-319-playwright/
            ${{ runner.temp }}/s5-v023-impl-319-playwright.json
            ${{ runner.temp }}/s5-v023-impl-319-playwright.stderr.log
            ${{ runner.temp }}/s5-v023-impl-319-playwright.exit
            ${{ runner.temp }}/s5-v023-impl-319-build-mode.txt
            ${{ runner.temp }}/s5-v023-impl-319-readiness.txt
            ${{ runner.temp }}/s5-v023-impl-319-startup.json
            ${{ runner.temp }}/s5-v023-impl-319-mock.log
            ${{ runner.temp }}/s5-v023-impl-319-server.log
          if-no-files-found: error
          retention-days: 14
