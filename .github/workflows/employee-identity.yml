name: Employee Identity Chain

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: PostgreSQL Identity Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: employee_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    env:
      EXECUTION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/employee_identity
      EMPLOYEE_IDENTITY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/employee_identity
      RESOURCE_USE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/employee_identity
      KNOWLEDGE_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report source and executed revisions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source_sha=${SOURCE_SHA}"
          echo "executed_sha=$(git rev-parse HEAD)"
          echo "executed_tree=$(git rev-parse HEAD^{tree})"
          echo "executed_parents=$(git show -s --format=%P HEAD)"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run identity and affected execution regressions
        run: |
          set -o pipefail
          uv run pytest -q \
            console/backend/tests/test_execution_postgres.py \
            console/backend/tests/test_digital_employee_postgres.py \
            console/backend/tests/test_execution_application_postgres.py \
            console/backend/tests/test_digital_employee_api_postgres.py \
            console/backend/tests/test_digital_employee_definition.py \
            console/backend/tests/test_digital_employee_definition_postgres.py \
            console/backend/tests/test_employee_identity_chain_postgres.py \
            console/backend/tests/test_execution_application.py \
            console/backend/tests/test_digital_employee_application.py \
            console/backend/tests/test_digital_employee_api.py \
            console/backend/tests/test_workflow_control_postgres.py \
            console/backend/tests/test_workflow_control_application_postgres.py \
            console/backend/tests/test_workflow_control_application.py \
            console/backend/tests/test_resource_use_postgres.py \
            console/backend/tests/test_knowledge_resource_use_integration.py \
            | tee "$RUNNER_TEMP/employee-identity-pytest.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/employee-identity-pytest.txt"; then
            echo "Selected identity-chain tests must not be skipped" >&2
            exit 1
          fi

  skill-invocation:
    name: PostgreSQL Skill Invocation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:bfee8fabec7c662311eff39111a890f68a46a78a3b35e91353e185e7d5918517
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skill_invocation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skill_invocation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILL_INVOCATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/skill_invocation
      GOVERNED_EXECUTION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/skill_invocation
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report source and executed revisions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source_sha=${SOURCE_SHA}"
          echo "executed_sha=$(git rev-parse HEAD)"
          echo "executed_tree=$(git rev-parse HEAD^{tree})"
          echo "executed_parents=$(git show -s --format=%P HEAD)"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run governed Skill PostgreSQL and protocol acceptance
        run: |
          set -o pipefail
          uv run pytest -q \
            console/backend/tests/test_governed_execution_api_postgres.py \
            console/backend/tests/test_workflow_skill_authoring_postgres.py \
            console/backend/tests/test_workflow_definition_resolver.py \
            console/backend/tests/test_skill_operation_schema.py \
            console/backend/tests/test_skill_mcp_api.py \
            console/backend/tests/test_skill_mcp_service.py \
            console/backend/tests/test_skill_invocation_domain.py \
            console/backend/tests/test_skill_invocation_postgres.py \
            console/backend/tests/test_workflow_definition_api.py \
            console/backend/tests/test_workflow_definition_service.py \
            | tee "$RUNNER_TEMP/skill-invocation-pytest.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/skill-invocation-pytest.txt"; then
            echo "Selected Skill invocation tests must not be skipped" >&2
            exit 1
          fi

  business-problem-entry:
    name: PostgreSQL Business Problem and Plan Entry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:bfee8fabec7c662311eff39111a890f68a46a78a3b35e91353e185e7d5918517
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: business_problem_entry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d business_problem_entry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BUSINESS_PROBLEM_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_problem_entry
      EXECUTION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_problem_entry
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report source and executed revisions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source_sha=${SOURCE_SHA}"
          echo "executed_sha=$(git rev-parse HEAD)"
          echo "executed_tree=$(git rev-parse HEAD^{tree})"
          echo "executed_parents=$(git show -s --format=%P HEAD)"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run isolated Product and Plan entry acceptance
        run: |
          set -o pipefail
          uv run pytest -q \
            console/backend/tests/test_business_problem_api_postgres.py \
            console/backend/tests/test_business_problem_entry_foundation.py \
            console/backend/tests/test_business_problem_domain.py \
            console/backend/tests/test_business_problem_postgres.py \
            | tee "$RUNNER_TEMP/business-problem-entry-pytest.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/business-problem-entry-pytest.txt"; then
            echo "Selected Product and Plan tests must not be skipped" >&2
            exit 1
          fi
