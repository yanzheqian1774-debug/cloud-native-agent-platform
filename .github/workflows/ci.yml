name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    env:
      AGENT_DEFINITION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      AGENT_DEFINITION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      SKILL_MCP_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      SKILL_MCP_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      KNOWLEDGE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      KNOWLEDGE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      WORKFLOW_RUNTIME_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      WORKFLOW_RUNTIME_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      AUTHORITY_I1_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      KNOWLEDGE_QDRANT_URL: http://127.0.0.1:6333
      KNOWLEDGE_TEST_QDRANT_URL: http://127.0.0.1:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch frozen v0.2.2 compatibility source
        run: |
          git fetch --no-tags origin 51fa5fcb266f1e58083c917dd4c99a02d9165c65
          git fetch --no-tags origin 9a515446f9f7baf551b6f3d5762fac9a70dac27a

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run quality gates
        run: make check

      - name: Run authority I1 PostgreSQL acceptance with zero skips
        run: |
          result="$(uv run pytest -q console/backend/tests/test_authority_foundation_postgres.py -r s)"
          echo "$result"
          if echo "$result" | grep -Eq '(^|[[:space:]])skipped([[:space:]]|$)'; then
            exit 1
          fi

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: console/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: console/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: console/frontend
        run: npm run build

  agent-workbench-browser:
    name: Agent Workbench Browser Acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
    env:
      AGENT_DEFINITION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      SKILL_MCP_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      KNOWLEDGE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      WORKFLOW_RUNTIME_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      WORKFLOW_RUNTIME_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_platform
      KNOWLEDGE_QDRANT_URL: http://127.0.0.1:6333
      PYTHONPATH: conformance_harness/src:core/src:gateway/src:operator/src:runtime/src:console/backend/src:experiments/s5-spike-005-runtime-target-manifest:experiments/s5-spike-007-capability-rest-fixtures

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install frontend and Chromium
        working-directory: console/frontend
        timeout-minutes: 5
        run: |
          npm ci
          install_log="$(mktemp "$RUNNER_TEMP/playwright-install.XXXXXX.log")"
          trap 'rm -f "$install_log"' EXIT
          apt_index_url="https://dl.google.com/linux/chrome-stable/deb/dists/stable/main/binary-amd64/Packages.gz"

          for install_attempt in 1 2 3; do
            : >"$install_log"

            set +e
            npx playwright install --with-deps chromium 2>&1 | tee "$install_log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e

            playwright_exit_code="${pipeline_status[0]}"
            tee_exit_code="${pipeline_status[1]}"
            if [ "$tee_exit_code" -ne 0 ]; then
              echo "playwright_install attempt=${install_attempt}/3 exit_code=${playwright_exit_code} error_category=install_log_write_failure"
              exit "$tee_exit_code"
            fi

            if [ "$playwright_exit_code" -eq 0 ]; then
              echo "playwright_install attempt=${install_attempt}/3 exit_code=0 error_category=none"
              break
            fi

            set +e
            awk -v allowed_url="$apt_index_url" '
              function is_allowed_failure(line, prefix, suffix) {
                prefix = "E: Failed to fetch " allowed_url
                if (index(line, prefix) != 1) {
                  return 0
                }
                suffix = substr(line, length(prefix) + 1)
                return suffix ~ /^[[:space:]]+Hash Sum mismatch[[:space:]]*$/
              }

              function is_allowed_wrapper(line) {
                return line == "E: Some index files failed to download. They have been ignored, or old ones used instead." ||
                  line == "Failed to install browsers" ||
                  line ~ /^Error: Installation process exited with code: 100[[:space:]]*$/
              }

              function is_allowed_hash_detail(line) {
                return line ~ /^[[:space:]]+(Hashes of expected file:|Hashes of received file:)[[:space:]]*$/ ||
                  line ~ /^[[:space:]]+(Last modification reported:|Release file created at:)[[:space:]]+[^[:cntrl:]]+$/ ||
                  line ~ /^[[:space:]]+- (Filesize|MD5Sum|SHA1|SHA256|SHA512):[[:xdigit:]]+([[:space:]]+\[weak\])?[[:space:]]*$/
              }

              function has_failure_signal(line, lower) {
                lower = tolower(line)
                return line ~ /^(E:|Err:|[Ee]rror:|npm ERR!|npm error|fatal:)/ ||
                  lower ~ /(^|[^[:alnum:]_])(failed|failure|killed|signal|segmentation fault|terminated|aborted|panic|exception)([^[:alnum:]_]|$)/
              }

              {
                if (is_allowed_failure($0)) {
                  allowed_failure_count += 1
                  in_failure_tail = 1
                  next
                }
                if ($0 ~ /^(E:|[Ee]rror:|npm ERR!|fatal:)/ && !is_allowed_wrapper($0)) {
                  found_unexpected_failure = 1
                  next
                }
                if (is_allowed_wrapper($0)) {
                  if ($0 ~ /^E: Some index files failed/) apt_wrapper_count += 1
                  else if ($0 == "Failed to install browsers") browser_wrapper_count += 1
                  else process_wrapper_count += 1
                  next
                }
                if (in_failure_tail && ($0 ~ /^[[:space:]]*$/ || is_allowed_hash_detail($0))) {
                  next
                }
                if (has_failure_signal($0)) {
                  found_unexpected_failure = 1
                  next
                }
                if (in_failure_tail) {
                  found_unknown_tail = 1
                }
              }

              END {
                if (allowed_failure_count != 1 ||
                    apt_wrapper_count != 1 ||
                    browser_wrapper_count != 1 ||
                    process_wrapper_count != 1) {
                  exit 1
                }
                if (found_unexpected_failure || found_unknown_tail) {
                  exit 2
                }
                exit 0
              }
            ' "$install_log"
            classification_exit_code="$?"
            set -e

            case "$classification_exit_code" in
              0)
                error_category="google_apt_index_hash_sum_mismatch"
                ;;
              2)
                error_category="mixed_playwright_install_failure"
                ;;
              *)
                error_category="playwright_install_failure_unclassified"
                ;;
            esac
            echo "playwright_install attempt=${install_attempt}/3 exit_code=${playwright_exit_code} error_category=${error_category}"

            if [ "$error_category" != "google_apt_index_hash_sum_mismatch" ] || [ "$install_attempt" -eq 3 ]; then
              exit "$playwright_exit_code"
            fi

            if [ "$install_attempt" -eq 1 ]; then
              sleep 30
            else
              sleep 60
            fi
          done

      - name: Build immutable browser release
        working-directory: console/frontend
        env:
          VITE_SUPPLIER_QUALITY_DEMO_MODE: live
          VITE_BACKEND_URL: http://127.0.0.1:18072
        run: |
          npm run build
          ../../.venv/bin/python ../../scripts/acceptance/browser_build_preflight.py \
            --frontend-root dist \
            --output "$RUNNER_TEMP/s5-impl-075-build-identity.json" \
            --build-mode "$VITE_SUPPLIER_QUALITY_DEMO_MODE"

      - name: Provision exact browser validation role
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: agent_platform
          PGUSER: postgres
        run: |
          psql --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE browser_validation LOGIN" \
            --command "GRANT CONNECT, CREATE ON DATABASE agent_platform TO browser_validation"

      - name: Run real browser acceptance
        id: browser_acceptance
        env:
          CONSOLE_FRONTEND_PORT: "14173"
          KNOWLEDGE_DIAGNOSTIC_REPORT_PATH: ${{ runner.temp }}/s5-v023-impl-312-browser-diagnostics/browser-diagnostics.v1.json
        run: |
          mkdir "$RUNNER_TEMP/s5-impl-072-release"
          rsync -a \
            --exclude .git \
            --exclude .venv \
            --exclude __pycache__ \
            --exclude '*.pyc' \
            --exclude .pytest_cache \
            --exclude .ruff_cache \
            "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/s5-impl-072-release/"
          chmod -R a-w "$RUNNER_TEMP/s5-impl-072-release"
          .venv/bin/python "$RUNNER_TEMP/s5-impl-072-release/scripts/acceptance/isolated_browser_harness.py" \
            --release-root "$RUNNER_TEMP/s5-impl-072-release" \
            --runtime-dir "$RUNNER_TEMP/s5-impl-072-${GITHUB_RUN_ID}" \
            --backend-host 127.0.0.1 \
            --backend-port 18072 \
            --frontend-port 14173 \
            --postgres-url postgresql://browser_validation@127.0.0.1:5432/agent_platform \
            --postgres-validation-role browser_validation \
            --qdrant-url http://127.0.0.1:6333 \
            --build-mode-identity "$RUNNER_TEMP/s5-impl-075-build-identity.json" \
            --journey-id s5-impl-075-agent-workbench \
            --python-path conformance_harness/src:core/src:gateway/src:operator/src:runtime/src:console/backend/src:experiments/s5-spike-005-runtime-target-manifest:experiments/s5-spike-007-capability-rest-fixtures \
            -- npm --prefix console/frontend run test:e2e -- \
              --workers 1 --retries 0 --forbid-only \
              --reporter json,./tests/harness/structuredKnowledgeReporter.ts

      - name: Retain sanitized browser diagnostics
        if: >-
          ${{
            always() &&
            (
              steps.browser_acceptance.outcome == 'success' ||
              steps.browser_acceptance.outcome == 'failure' ||
              steps.browser_acceptance.outcome == 'cancelled'
            )
          }}
        uses: actions/upload-artifact@v4
        with:
          name: s5-v023-impl-312-browser-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/s5-v023-impl-312-browser-diagnostics/browser-diagnostics.v1.json
          if-no-files-found: error
          retention-days: 7
